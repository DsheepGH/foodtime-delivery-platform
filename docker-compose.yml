services:
  mysql:
    image: mysql:8.0
    container_name: foodtime-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "123456"
      MYSQL_DATABASE: foodtime_delivery
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - foodtime-mysql-data:/var/lib/mysql
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p123456"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: foodtime-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "123456"]
    ports:
      - "6379:6379"
    volumes:
      - foodtime-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "123456", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  foodtime-mysql-data:
  foodtime-redis-data:
